<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <img src="../static/images/user-interface.png" alt="" class="login-icon"/>
        <p>Sign in</p>
        <input type="text" placeholder="Username" class="login-input" />
        <br/>
        <input type="text" placeholder="Password" class="login-input" />
        <br/>
        <br/>
        <button class="login-button">Login</button>
        <br/>
        <p class="login-register">Don't have an account? <button class="login-register-button">Register here</button></p>
    </div>
</body>

<style>

body {
  text-align: center;
  background: #4f5cc4;
  background: linear-gradient(0deg,rgba(79, 92, 196, 1) 0%, rgba(83, 224, 237, 1) 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: calc(10px + 2vmin);
  color: white;
}
.container {
    box-sizing: border-box;
    padding: 120px;
    background: #4f5cc4;
    background: linear-gradient(0deg,rgba(79, 92, 196, 1) 0%, rgba(83, 224, 237, 1) 100%);
    border: 2px solid white;
    border-radius: 8px;
    box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.3);
}

.login-input {
  background: transparent;
  border: none;
  border-bottom: 2px solid white;
  padding: 8px 4px;
  color: white;
  font-size: 16px;
  outline: none;
}

.login-button {

    background: transparent;
    color: white;
    font-size: 18px;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 2px;
    border: 2px solid white;
    cursor: pointer;
    transition-duration: .2s;
}

.login-button:hover {
    transition-duration: .2s;
    background-color: rgba(255,255,255,0.3);
}

.login-register {
    font-size: 12px;
    color: rgb(219, 219, 219);
}

.login-register-button {
    font-size: 12px;
    border: none;
    border-bottom: 1px solid rgb(219, 219, 219);
    background: transparent;
    color: rgb(219, 219, 219);
        cursor: pointer;
}

.login-icon {
    filter: invert(100%);
}
</style>
</html>
